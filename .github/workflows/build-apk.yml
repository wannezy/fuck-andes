name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize daemon toolchain vendor
        run: |
          if [ -f gradle/gradle-daemon-jvm.properties ]; then
            sed -i 's/toolchainVendor=JETBRAINS/toolchainVendor=ADOPTIUM/' gradle/gradle-daemon-jvm.properties
          fi

      - name: Build debug and release APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
